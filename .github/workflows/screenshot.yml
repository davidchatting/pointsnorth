name: Screenshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate screenshot.png from the live demo
        run: |
          npm install --no-save playwright@1.47.0
          npx playwright install --with-deps chromium

          node .github/workflows/screenshot.js

      - name: Crop a centered square version
        run: |
          W=$(identify -format "%w" screenshot.png)
          H=$(identify -format "%h" screenshot.png)
          SIDE=$((W<H?W:H))
          XOFF=$(( (W-SIDE)/2 ))
          YOFF=$(( (H-SIDE)/2 ))
          convert screenshot.png -crop ${SIDE}x${SIDE}+${XOFF}+${YOFF} +repage screenshot-square.png

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add screenshot.png screenshot-square.png
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Regenerate screenshot.png / screenshot-square.png"
          git push
